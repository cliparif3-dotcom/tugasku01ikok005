<!DOCTYPE html><html lang="id"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>TUGASKU</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17294D;--bg:#F5F6FA;--mut:#667394;--k1:#FFC93C;--k2:#4CB878;--red:#E5383B;--line:#E3E7F1;--blue:#2F6FED}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:88px}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{position:relative;height:250px;background:var(--ink)}.hero img{width:100%;height:100%;object-fit:cover;opacity:.85}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff;background:linear-gradient(transparent 30%,rgba(23,41,77,.95))}
.ov h1{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1}.ov p{opacity:.9}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:20px 0 10px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.big{background:var(--ink);color:#fff;border:0}.big b{font-size:22px}.big small{color:#C9D3EE}
.row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ch{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;margin:5px 5px 0 0}
.tm{background:#E4EDFF;color:#1D4FBF}.mt{background:#FFF1CC;color:#7A5600}.ex{background:#FDE3E4;color:#B3171A}
small{display:block;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;padding:6px 2px;font-size:11px;font-weight:600;color:var(--mut);border-radius:10px}nav button span{display:block;font-size:20px}
nav button.on{color:var(--blue);background:#EEF3FF}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chips button{white-space:nowrap;padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13.5px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wk{border-left:5px solid var(--line)}.wk.now{border-color:var(--blue);box-shadow:0 0 0 2px #CFE0FF}.wk.exm{border-color:var(--red)}
.wk summary{cursor:pointer;font-weight:700;list-style:none}.wk summary small{font-weight:400}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--blue)}
.mk{width:100%;text-align:left}
.tk{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.tk>div{flex:1;min-width:0}.tk.dn b{text-decoration:line-through;color:var(--mut)}
.ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--mut);color:#fff;font-weight:800;flex:none}.dn .ck{background:var(--k2);border-color:var(--k2)}
.pill{font-size:12px;font-weight:700;color:#fff;padding:3px 9px;border-radius:99px;white-space:nowrap}
.x{opacity:.5}.fab{position:fixed;right:16px;bottom:84px;background:var(--blue);color:#fff;font-weight:700;padding:12px 18px;border-radius:99px;box-shadow:0 6px 16px rgba(47,111,237,.4)}
.sel{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
dialog{border:0;border-radius:18px;width:min(92vw,460px);padding:18px}dialog::backdrop{background:rgba(23,41,77,.5)}
dialog label{display:block;font-weight:600;font-size:13px;margin:8px 0 3px}dialog input,dialog select,dialog textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px}
.pri{background:var(--blue);color:#fff;font-weight:700;padding:11px;border-radius:12px;width:100%;margin-top:14px}
.go{display:inline-block;margin-top:8px;background:var(--blue);color:#fff;font-weight:700;padding:7px 14px;border-radius:99px;text-decoration:none;font-size:13.5px}
.emp{text-align:center;color:var(--mut);padding:26px 10px}
@media(prefers-reduced-motion:no-preference){main{animation:f .3s}@keyframes f{from{opacity:0}}}
</style></head><body>

const rng=w=>F(D(w[2]))+'–'+F(A(D(w[2]),5));
const cell=(c,w)=>{const [l,d]=w[3][(c.k-1)*3+c.s-2].split('|');return{l:l?l.split(','):[],d:d?d.split(','):[]}};
const exam=(c,w)=>w[3]==='UTS'?(c.k==1?'UTS tatap muka':'UTS daring'):(c.k==1?'UAS daring':'UAS tatap muka');
const mts=c=>{let a=[];W.forEach(w=>{if(typeof w[3]=='string')return;const x=cell(c,w);x.l.forEach(n=>a.push({n:+n,j:'T',dt:D(w[1])}));x.d.forEach(n=>a.push({n:+n,j:'M',dt:A(D(w[2]),5)}))});return a.sort((p,q)=>p.n-q.n)};

function item(t){const c=C[t.c],x=dl(t);return`<div class="tk ${x.dn?'dn':''}"><button class="ck" aria-label="Tandai selesai" onclick="tg('${t.id}')">${x.dn?'✓':''}</button><div><b>${esc(t.t)}</b><small>${c.e} ${c.n} · ${t.j=='M'?'Mentari':'Tatap muka'} · Pert. ${t.p}</small>${t.cat?`<small>${esc(t.cat)}</small>`:''}</div><span class="pill" style="background:${x.col}">${x.txt}</span></div>`}
function home(){const w=cw(),t=td(),up=T.filter(x=>!done.includes(x.id)).sort((a,b)=>a.dl<b.dl?-1:1).slice(0,3);let h='';
if(w){const ex=typeof w[3]=='string';h+=`<div class="card big"><small>Sekarang</small><b>Pekan ${w[0]}</b><small>${rng(w)} · tatap muka ${FL(D(w[1]))}</small></div>`;
if(ex)h+=`<div class="card"><b>Pekan ${w[3]}</b><small>Kelompok 1: ${w[3]=='UTS'?'UTS tatap muka':'UAS daring'} · Kelompok 2: ${w[3]=='UTS'?'UTS daring':'UAS tatap muka'}</small></div>`;
else h+='<h2>Agenda pekan ini</h2>'+C.map(c=>{const x=cell(c,w);if(!x.l.length&&!x.d.length)return'';return`<div class="row" style="border-left:5px solid ${KC(c.k)}"><b>${c.e} ${c.n}</b><div>${x.l.length?`<span class="ch tm">Tatap muka · ${FL(D(w[1]))} · Pert. ${x.l.join(', ')}</span>`:''}${x.d.length?`<span class="ch mt">Mentari · ${rng(w)} · Pert. ${x.d.join(', ')}</span>`:''}</div></div>`}).join('')}
else h+='<div class="card">Hari ini di luar jadwal perkuliahan.</div>';
const u=D('2026-10-19'),d=Math.round((u-t)/864e5);if(d>0)h+=`<div class="card"><b>UTS dimulai ${d} hari lagi</b><small>19–24 Oktober 2026</small></div>`;
h+='<h2>Tugas terdekat</h2>'+(up.length?up.map(item).join(''):'<div class="emp">Belum ada tugas. Tambahkan lewat menu Tugas.</div>');return h}
function jdw(){return`<div class="chips">${['Semua','Kelompok 1','Kelompok 2'].map((n,i)=>`<button class="${fk==i?'on':''}" onclick="fk=${i};draw()">${n}</button>`).join('')}</div>`+W.map(w=>{const ex=typeof w[3]=='string',n=cw()===w,cs=C.filter(c=>!fk||c.k==fk);

const csv=t=>{const r=[];let c=[],f='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=ch}else if(ch=='"')q=1;else if(ch==','){c.push(f);f=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;c.push(f);r.push(c);c=[];f=''}else f+=ch}if(f||c.length){c.push(f);r.push(c)}return r.slice(1).filter(x=>x.some(y=>y.trim()))};
const get=n=>fetch('https://docs.google.com/spreadsheets/d/'+SID+'/gviz/tq?tqx=out:csv&sheet='+n).then(r=>{if(!r.ok)throw 0;return r.text()}).then(csv);
const mi=v=>{v=String(v||'').trim().toLowerCase();if(!v)return -1;const n=+v;if(n>=1&&n<=8)return n-1;return C.findIndex(c=>c.n.toLowerCase().includes(v)||v.includes(c.n.toLowerCase()))};
const pd=v=>{v=String(v||'').trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''};
const hs=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return (h>>>0).toString(36)};
const ok=u=>/^https:\/\/(drive|docs)\.google\.com\//.test(u);
// Tab Tugas: matkul | jenis | pertemuan | judul | deadline | catatan
const toT=rs=>rs.map(r=>({id:'t'+hs(r.join('|')),c:mi(r[0]),j:/^t/i.test((r[1]||'').trim())?'T':'M',p:(r[2]||'').trim(),t:(r[3]||'').trim(),dl:pd(r[4]),cat:(r[5]||'').trim()})).filter(x=>x.c>=0&&x.t&&x.dl);
// Tab Link: tipe (Kumpul/Modul) | matkul | judul | link | deadline | catatan
const toL=rs=>rs.map(r=>({id:'l'+hs(r.join('|')),tp:/^m/i.test((r[0]||'').trim())?'M':'K',c:mi(r[1]),t:(r[2]||'').trim(),u:(r[3]||'').trim(),dl:pd(r[4]),cat:(r[5]||'').trim()})).filter(x=>x.c>=0&&x.t&&ok(x.u));
function load(){const done_=()=>{try{localStorage.setItem('tk_c',JSON.stringify([T,L]))}catch(e){}draw()};
Promise.all([get('Tugas'),get('Link')]).then(([a,b])=>{T=toT(a);L=toL(b);er=0;done_()}).catch(()=>{er=1;try{[T,L]=JSON.parse(localStorage.getItem('tk_c'))}catch(e){}draw()})}
function lnk(tp){const K=tp=='K',s=K?'Tugas dosen yang dikumpulkan lewat Google Drive. Ketuk tombol, lalu unggah file di folder yang terbuka.':'Modul dan materi per mata kuliah. Ketuk tombol untuk membaca atau mengunduh.';
const l=L.filter(x=>x.tp==tp&&(fl===''||x.c==fl)).sort((a,b)=>K?((a.dl||'9')<(b.dl||'9')?-1:1):a.c-b.c);
return`<small style="margin-bottom:8px">${s}</small><select class="sel" aria-label="Filter mata kuliah" onchange="fl=this.value;draw()"><option value="">Semua mata kuliah</option>${C.map(c=>`<option value="${c.i}" ${fl===String(c.i)?'selected':''}>${c.e} ${c.n}</option>`).join('')}</select>`+(l.length?l.map(x=>{const c=C[x.c],p=x.dl?dl({dl:x.dl,id:'-'}):null;return`<div class="tk"><div><b>${esc(x.t)}</b><small>${c.e} ${c.n}</small>${x.cat?`<small>${esc(x.cat)}</small>`:''}${x.dl?`<small>Batas: ${FL(D(x.dl))}</small>`:''}<a class="go" href="${esc(x.u)}" target="_blank" rel="noopener">${K?'Buka folder kumpul':'Buka modul'}</a></div>${p?`<span class="pill" style="background:${p.col}">${p.txt}</span>`:''}</div>`}).join(''):`<div class="emp">${K?'Belum ada link kumpul tugas.':'Belum ada modul.'}</div>`)}
load();
</script></body></html>
