<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17294D;--bg:#F5F6FA;--mut:#667394;--k1:#FFC93C;--k2:#4CB878;--red:#E5383B;--line:#E3E7F1;--blue:#2F6FED}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:88px}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{position:relative;height:250px;background:var(--ink)}.hero img{width:100%;height:100%;object-fit:cover;opacity:.85}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff;background:linear-gradient(transparent 30%,rgba(23,41,77,.95))}
.ov h1{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1}.ov p{opacity:.9}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:20px 0 10px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.big{background:var(--ink);color:#fff;border:0}.big b{font-size:22px}.big small{color:#C9D3EE}
.row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ch{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;margin:5px 5px 0 0}
.tm{background:#E4EDFF;color:#1D4FBF}.mt{background:#FFF1CC;color:#7A5600}.ex{background:#FDE3E4;color:#B3171A}
small{display:block;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;padding:6px 2px;font-size:11px;font-weight:600;color:var(--mut);border-radius:10px}nav button span{display:block;font-size:20px}
nav button.on{color:var(--blue);background:#EEF3FF}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chips button{white-space:nowrap;padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13.5px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wk{border-left:5px solid var(--line)}.wk.now{border-color:var(--blue);box-shadow:0 0 0 2px #CFE0FF}.wk.exm{border-color:var(--red)}
.wk summary{cursor:pointer;font-weight:700;list-style:none}.wk summary small{font-weight:400}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--blue)}
.mk{width:100%;text-align:left}
.tk{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.tk>div{flex:1;min-width:0}.tk.dn b{text-decoration:line-through;color:var(--mut)}
.ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--mut);color:#fff;font-weight:800;flex:none}.dn .ck{background:var(--k2);border-color:var(--k2)}
.pill{font-size:12px;font-weight:700;color:#fff;padding:3px 9px;border-radius:99px;white-space:nowrap}
.x{opacity:.5}.fab{position:fixed;right:16px;bottom:84px;background:var(--blue);color:#fff;font-weight:700;padding:12px 18px;border-radius:99px;box-shadow:0 6px 16px rgba(47,111,237,.4)}
.sel{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
dialog{border:0;border-radius:18px;width:min(92vw,460px);padding:18px}dialog::backdrop{background:rgba(23,41,77,.5)}
dialog label{display:block;font-weight:600;font-size:13px;margin:8px 0 3px}dialog input,dialog select,dialog textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px}
.pri{background:var(--blue);color:#fff;font-weight:700;padding:11px;border-radius:12px;width:100%;margin-top:14px}
.go{display:inline-block;margin-top:8px;background:var(--blue);color:#fff;font-weight:700;padding:7px 14px;border-radius:99px;text-decoration:none;font-size:13.5px}
.chip2{margin-top:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:12.5px}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--line)}.gal img:only-child{grid-column:1/-1;aspect-ratio:auto;max-height:420px}
#lb{display:none;position:fixed;inset:0;background:rgba(10,18,40,.93);z-index:50;align-items:center;justify-content:center}#lb img{max-width:96%;max-height:90%;border-radius:8px}#lb small{position:absolute;bottom:14px;width:100%;text-align:center;color:#fff}
.org{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}.av{flex:none;width:42px;height:42px;border-radius:50%;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}.org b{display:block;line-height:1.3}
.wa{flex:none;margin-left:auto;background:#128C4A;color:#fff;font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:99px;text-decoration:none}
.ab{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.ab span{flex:1;min-width:0;font-size:13.5px}.ab div{display:flex;gap:4px}.st{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800;color:var(--mut)}.st.on{color:#fff;border-color:transparent}.st.on.Hadir{background:#2E9B5C}.st.on.Sakit{background:#E39B00}.st.on.Izin{background:#2F6FED}.st.on.Alfa{background:#E5383B}
#sr{max-width:640px;margin:0 auto;padding:12px 16px 0}#qs{width:100%;padding:11px 16px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:15px}
#dm{position:absolute;z-index:2;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;font-size:18px}
.qt{background:#FFF6D6;border-color:#F0D98A;color:#17294D}.an{background:#E4EDFF;border-color:#B9CFFF;color:#17294D}.qt small,.an small{color:#5B6785}
html[data-dark]{--ink:#E8ECF8;--bg:#0F1730;--mut:#9AA8CC;--line:#2A3A66}
html[data-dark] .card,html[data-dark] .row,html[data-dark] .tk,html[data-dark] nav,html[data-dark] .chips button,html[data-dark] .sel,html[data-dark] .chip2,html[data-dark] .st,html[data-dark] #qs{background:#1B2748}
html[data-dark] .big{background:#22345F}html[data-dark] .chips button.on{background:#E8ECF8;color:#0F1730}html[data-dark] .card.ex{background:#4A2530}html[data-dark] nav button.on{background:#22345F}
.qt .lb{color:#7A5600}.an .lb{color:#1D4FBF}
html[data-dark] .qt{background:#3B3217;border-color:#6B5A25;color:#FFE9A8}html[data-dark] .qt .lb{color:#F2D77A}
html[data-dark] .an{background:#1E3158;border-color:#3A5A9A;color:#DCE8FF}html[data-dark] .an .lb{color:#9DC0FF}html[data-dark] .an small{color:#B4C6EA}
#ft{max-width:640px;margin:6px auto 0;padding:0 16px 8px;text-align:center;font-size:11.5px;line-height:1.6;color:var(--mut)}#ft b{font-weight:600}
.cm{border-top:1px solid var(--line);padding:6px 0}.cm small{display:inline}.cmt{width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}

const akOn=k=>AK.filter(e=>k>=e[0]&&k<=(e[1]||e[0]));
const kn=d=>{const m=ki+d;if(m<0||m>=MS.length)return;ki=m;ks0='';draw(1)};
function kdet(k){const d=D(k),w=W.find(x=>d>=D(x[2])&&d<=A(D(x[2]),6)),dls=T.filter(x=>x.dl==k),ev=akOn(k);let h=`<div class="card"><b>${FL(d)}</b>`;
h+=ev.map(e=>`<div class="jd"><div class="jt"><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${AKC[e[2]][0]}"></i></div><div><b>${e[3]}</b><small>${AKC[e[2]][1]}${e[1]?' · '+F(D(e[0]))+' – '+F(D(e[1])):''}</small></div></div>`).join('');
if(w){if(typeof w[3]=='string')h+=`<small>Pekan ${w[3]} · ${rng(w)}<br>Kelompok 1: ${w[3]=='UTS'?'tatap muka':'daring'} · Kelompok 2: ${w[3]=='UTS'?'daring':'tatap muka'}</small>`;
else if(k==w[1]){const x=C.map(c=>({c:c,l:cell(c,w).l})).filter(o=>o.l.length);h+='<small style="margin-top:6px">Tatap muka kelas:</small>'+(x.length?x.map(o=>`<div class="jd"><div class="jt">📚</div><div><b>${o.c.n}</b><small>Pertemuan ${o.l.join(', ')}</small></div></div>`).join(''):'<small>Tidak ada pertemuan tatap muka.</small>')}
else h+=`<small style="margin-top:6px">Pekan ${w[0]} · Mentari ${rng(w)}</small>`}else if(!ev.length)h+='<small>Di luar jadwal perkuliahan.</small>';
if(dls.length)h+='<h2 style="margin:10px 0 6px">Deadline tugas</h2>'+dls.map(item).join('');return h+'</div>'}
function kal(){const y=MS[ki][0],m=MS[ki][1],off=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),t=iso(td()),lur={},dl={};W.forEach(w=>{lur[w[1]]=1});T.forEach(x=>{dl[x.dl]=1});
let c='';for(let i=0;i<off;i++)c+='<div></div>';
for(let d=1;d<=nd;d++){const k=iso(new Date(y,m,d)),ev=akOn(k),cats=[...new Set(ev.map(e=>e[2]))].filter(x=>x!='l'),hol=ev.some(e=>e[2]=='l'),pk=ev.some(e=>e[2]=='u'&&e[1]),
dots=cats.map(x=>`<i style="background:${AKC[x][0]}"></i>`).join('')+(lur[k]?'<i style="background:var(--k2)"></i>':'')+(dl[k]?'<i style="background:var(--red)"></i>':'');
c+=`<button class="kd${k==t?' tdy':''}${pk?' ex':''}${hol?' hol':''}${k==ks0?' sel':''}" aria-label="${d} ${BL[m]}" onclick="ks0='${k}';draw(1)">${d}<span class="dts">${dots}</span></button>`}
const ms=iso(new Date(y,m,1)),me=iso(new Date(y,m,nd)),ag=AK.filter(e=>e[0]<=me&&(e[1]||e[0])>=ms).sort((a,b)=>a[0]<b[0]?-1:1);
return`<small style="margin-bottom:8px;font-weight:600">${CFG.kalenderJudul}</small><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><button class="cta2" aria-label="Bulan sebelumnya" onclick="kn(-1)">‹</button><b>${BL[m]} ${y}</b><button class="cta2" aria-label="Bulan berikutnya" onclick="kn(1)">›</button></div><div class="kg">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<div class="kh">${x}</div>`).join('')}${c}</div><small style="margin-bottom:10px">🟠 awal perkuliahan · 🟡 UTS/UAS · 🔵 pembayaran dan registrasi · 🟢 tatap muka kelas · 🔴 deadline tugas · angka merah = libur</small>${ks0?kdet(ks0):'<small>Ketuk tanggal untuk melihat detailnya.</small>'}<h2>Agenda ${BL[m]}</h2>${ag.length?ag.map(e=>`<div class="jd"><div class="jt">${e[1]?F(D(e[0]))+' – '+F(D(e[1])):F(D(e[0]))}</div><div><b>${e[3]}</b><small>${AKC[e[2]][1]}</small></div></div>`).join(''):'<small>Tidak ada agenda akademik.</small>'}<small style="margin-top:10px">Sumber: ${CFG.kalenderSumber}. Tanggal dapat disesuaikan sewaktu-waktu oleh kampus.</small>`}
function jdw(){return`<div class="chips">${[['Daftar jadwal',0],['Kalender akademik',1]].map(a=>`<button class="${jv==a[1]?'on':''}" onclick="jv=${a[1]};draw()">${a[0]}</button>`).join('')}</div>`+(jv?kal():jdwList())}
const akCard=()=>{const t=iso(td()),up=AK.filter(e=>(e[1]||e[0])>=t).sort((a,b)=>a[0]<b[0]?-1:1).slice(0,3);return`<h2>Kalender Akademik</h2><div class="card">${up.length?up.map(e=>`<div class="jd"><div class="jt">${e[1]?F(D(e[0]))+' – '+F(D(e[1])):F(D(e[0]))}</div><div><b>${e[3]}</b><small>${AKC[e[2]][1]}</small></div></div>`).join(''):'<small>Tidak ada agenda akademik mendatang.</small>'}<button class="cta2" onclick="tab='jdw';jv=1;draw()">Buka kalender akademik →</button></div>`};
function applyCfg(){document.title=CFG.namaApp+' - '+CFG.kelas;$('#hk1').textContent=CFG.prodi+' · '+CFG.kampus;$('#hk2').textContent=CFG.namaApp;$('#hk3').textContent='Kelas '+CFG.kelas+' · '+CFG.semester;$('#hf').src=CFG.fotoHero;$('#gth').textContent=CFG.namaApp;$('#gk2').textContent='Kelas '+CFG.kelas+' · '+CFG.prodi+' '+CFG.kampus;$('#fc1').textContent='© '+CFG.tahunHakCipta+' '+CFG.pemilik+'.';$('#fc2').textContent=CFG.namaApp+' · Kelas '+CFG.kelas+' · '+CFG.prodi+' '+CFG.kampus;$('#fv').textContent='Versi '+VERSI}
// Akses Google Sheets pengelola: kode diperiksa SERVER, alamat Sheets baru dikirim setelah kode benar
function openSheet(){if(!/^https:\/\/script\.google\.com\//.test(API())){alert('Server belum tersambung. Coba lagi beberapa saat.');return}
dlg('Kode akses pengurus','Masukkan kode akses untuk membuka Google Sheets pengelola data kelas.<input id="kd" type="password" class="cmt" autocomplete="off" aria-label="Kode akses" placeholder="Kode akses" style="margin-top:10px">',[{t:'Batal'},{t:'Buka',c:'cta',f:cekKode}])}
function cekKode(){const pin=($('#kd').value||'').trim();if(!pin)return;
fetch(API(),{method:'POST',body:JSON.stringify({aksi:'bukaSheet',pin:pin})}).then(r=>r.json()).then(r=>{if(!r.ok){alert(r.msg);return}
dlg('Akses diterima','Sheets hanya bisa diedit oleh akun Google yang sudah kamu beri akses Editor.',[{t:'Tutup'},{t:'Sheets data kelas',c:'cta',f:()=>window.open(r.url,'_blank','noopener')},{t:'Sheets absensi'+'',f:()=>window.open(r.privat,'_blank','noopener')}])}).catch(()=>alert('Tidak bisa terhubung ke server.'))}
let POSTS=[],PF=null,PU=0,PV='',CMX='';
const ksl=()=>[...new Set([ORG,SEED,...(I||[])].map(x=>x.k))];
const EXT={pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',txt:'text/plain'};
const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Gagal membaca file ('+((r.error&&r.error.name)||'tidak diketahui')+')'));r.readAsDataURL(f)});
const VERSI='2026.10.10-c';
const ab64=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function bacaFile(f){try{return await rd(f)}catch(e1){try{return 'data:'+(f.type||'application/octet-stream')+';base64,'+ab64(await f.arrayBuffer())}catch(e2){throw e1}}}
async function kecilkan(f){const bm=await createImageBitmap(f),s=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.82)}
async function pfPick(el,kind){const f=el.files&&el.files[0];if(!f)return;
if(f.size>(kind=='gambar'?40:10)*1024*1024){el.value='';alert(kind=='gambar'?'Foto terlalu besar. Pilih foto lain.':'Ukuran lampiran maksimal 10 MB. Untuk video besar, unggah ke Drive lalu tempel linknya di postingan.');return}
const nm=f.name||'lampiran',tp=f.type||EXT[nm.split('.').pop().toLowerCase()]||'application/octet-stream';
try{let url,mime=tp,nama=nm;
if(kind=='gambar'&&/^image\/(jpeg|png|webp)$/.test(tp)){try{url=await kecilkan(f);mime='image/jpeg';nama=nm.replace(/\.\w+$/,'')+'.jpg'}catch(e){url=await bacaFile(f)}}else url=await bacaFile(f);
PF={f:{name:nm,type:tp,size:f.size},kind:kind,url:url,mime:mime,nama:nama};el.value='';draw(1)}
catch(e){el.value='';alert('File tidak bisa dibaca dari perangkat. Coba pilih ulang, atau salin file ke penyimpanan HP dulu (jangan langsung dari Google Foto atau Drive). Detail: '+(e&&e.message||e)+' [v'+VERSI+']')}}
async function medB64(){return{nama:PF.nama,mime:PF.mime,b64:PF.url.split(',')[1]}}
async function pfSend(){if(!NAMA){gate();return}const x=(CT.post||'').trim();if(!x&&!PF){alert('Tulis sesuatu atau pilih lampiran dulu.');return}if(PU)return;PU=1;draw(1);
try{const body={aksi:'post',nama:NAMA,isi:x};if(PF)body.media=await medB64();
const res=await fetch(API(),{method:'POST',body:JSON.stringify(body)}),tx=await res.text();let r;
try{r=JSON.parse(tx)}catch(e){throw new Error('SERVER:'+tx.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,140))}
if(r.ok){CT.post='';PF=null;await cmLoad()}else alert(r.msg)}
catch(e){const m=e&&e.message?e.message:(e&&e.target&&e.target.error?e.target.error.name:String(e));alert(m.indexOf('SERVER:')==0?'Server menolak kiriman. Kemungkinan izin Google Drive di Apps Script belum disetujui atau file terlalu besar. Detail: '+m.slice(7)+' [v'+VERSI+']':'Postingan gagal terkirim. '+(PF?'Coba file yang lebih kecil (maks. 10 MB). Detail: ':'Cek koneksi lalu coba lagi. Detail: ')+m.slice(0,100)+' [v'+VERSI+']')}
PU=0;draw(1)}
const composer=()=>NAMA&&/^https:\/\/script\.google\.com\//.test(API())?`<div class="card"><b>📝 Buat postingan</b><textarea class="cmt" rows="3" maxlength="500" placeholder="Apa yang ingin kamu bagikan, ${esc(tc(NAMA).split(' ')[0])}?" aria-label="Isi postingan" oninput="CT.post=this.value">${esc(CT.post||'')}</textarea>${PF?`<div class="act"><span class="bd d">${{gambar:'🖼️',file:'📎',video:'🎥'}[PF.kind]} ${esc(PF.f.name)}</span><button class="cta2" onclick="PF=null;draw(1)">✕ Hapus</button></div>`:''}<div class="act"><label class="cta2" for="pgi">🖼️ Gambar</label><label class="cta2" for="pfi">📎 File</label><label class="cta2" for="pvi">🎥 Video</label><button class="cta" ${PU?'disabled':''} onclick="pfSend()">${PU?'Mengunggah...':'Posting'}</button></div><small>Terlihat oleh semua teman sekelas. Lampiran maksimal 10 MB.</small></div>`:'';
const pLinks=s=>esc(s).replace(/(https:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function postCard(p){const k='p'+p.id;let md='';
if(p.f){if(p.j=='gambar'){IM.push('https://drive.google.com/thumbnail?id='+p.f+'&sz=w2000');md=`<img class="pimg" loading="lazy" src="https://drive.google.com/thumbnail?id=${esc(p.f)}&sz=w1000" alt="Gambar postingan" onclick="zoom(${IM.length-1})" onerror="this.replaceWith(document.createTextNode('Gambar belum bisa dimuat.'))">`}
else if(p.j=='video')md=PV==p.id?`<iframe class="pvid" src="https://drive.google.com/file/d/${esc(p.f)}/preview" allowfullscreen allow="autoplay"></iframe><small>Video yang baru diunggah bisa butuh beberapa menit sebelum bisa diputar.</small>`:`<button class="cta2" onclick="PV='${p.id}';draw(1)">▶ Putar video · ${esc(p.fn)}</button>`;
else md=`<a class="cta2" href="https://drive.google.com/file/d/${esc(p.f)}/view" target="_blank" rel="noopener">📎 ${esc(p.fn||'Lampiran')}</a>`}
return`<div class="card">${own(p)||AB?`<div class="dm"><button class="x" aria-label="Menu postingan" onclick="CMX=CMX=='${p.id}'?'':'${p.id}';draw(1)">⋮</button>${CMX==p.id?`<div class="pm"><button onclick="ppAsk('${p.id}')">🗑️ Hapus</button></div>`:''}</div>`:''}<b>${esc(tc(p.n))}</b> <small style="display:inline">${esc(p.t)}</small>${p.x?`<div style="white-space:pre-line;margin-top:6px">${pLinks(p.x)}</div>`:''}${md?`<div style="margin-top:8px">${md}</div>`:''}${cmBox({ck:k})}</div>`}
const postSec=all=>{const l=all?POSTS:POSTS.slice(0,3);return`<h2>Postingan kelas</h2>${composer()}`+(l.length?l.map(postCard).join('')+(!all&&POSTS.length>3?`<button class="cta2" onclick="fi=${ksl().length+2};draw()">Lihat semua postingan →</button>`:''):'<div class="emp">Belum ada postingan.</div>')};
function ppAsk(id){CMX='';draw(1);dlg('Hapus postingan?','Postingan ini akan dihapus dan tidak dapat dikembalikan.',[{t:'Batal'},{t:'Hapus',c:'cta dng',f:()=>ppDel(id)}])}
function ppDel(id){const p=POSTS.find(x=>x.id==id),q=p&&own(p)?fetch(API(),{method:'POST',body:JSON.stringify({aksi:'hapusPostSendiri',id:id,nama:NAMA})}).then(r=>r.json()):(AB?api({aksi:'hapusPost',id:id}):null);if(!q)return;q.then(r=>{if(r.ok)cmLoad();else alert(r.msg)}).catch(()=>alert('Gagal menghapus postingan.'))}
// Status pribadi (selesai, sedang, bookmark, catatan, notifikasi terbaca) disimpan terpisah untuk TIAP NAMA di perangkat ini
const UK=k=>k+'_'+(NAMA?hs(NAMA):'tamu');
function loadUser(){const g=(k,d)=>{try{const v=localStorage.getItem(UK(k));if(v!==null)return JSON.parse(v)}catch(e){}return d};
if(NAMA){try{['tk_d','tk_p','tk_ns','tk_ev','tk_dt','tk_bm','tk_cn'].forEach(k=>{const o=localStorage.getItem(k);if(o===null)return;if(localStorage.getItem(UK(k))===null)localStorage.setItem(UK(k),o);localStorage.removeItem(k)})}catch(e){}}
done=g('tk_d',[]);prog=g('tk_p',[]);NS=g('tk_ns',null);EV=g('tk_ev',[]);DT=g('tk_dt',{});BM=g('tk_bm',[]);CN=g('tk_cn',{})}

function lnk(tp){const K=tp=='K',s=K?'Tugas dosen yang dikumpulkan lewat Google Drive. Ketuk tombol, lalu unggah file di folder yang terbuka.':'Modul dan materi per mata kuliah. Ketuk tombol untuk membaca atau mengunduh.';
const l=L.filter(x=>x.tp==tp&&(fl===''||x.c==fl)).sort((a,b)=>K?((a.dl||'9')<(b.dl||'9')?-1:1):a.c-b.c);

{let s=null;try{s=localStorage.getItem('tk_dm')}catch(e){}dm(s===null?!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches):s==='1')}
applyCfg();
{let s='';try{s=localStorage.getItem('tk_nama')||''}catch(e){}NAMA=MHS.includes(s)?s:''}loadUser();gate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){cmLoad();ping()}});
setInterval(ping,60000);
